<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="style.css">
    <title>Number guessing game</title>
</head>
<body>

    <div id="fdiv" class="flex flex-col mx-auto items-center justify-center bg-cyan-600 w-100 h-100 gap-4 mt-10">
        <h1 id="ftxt" class="text-2xl font-bold text-white">Number guessing game</h1> 
        <input id="finput" type="text" class="rounded-md border mt-10 border-gray-300 px-3 py-2 w-80 bg-white text-black" placeholder="Enter your name"/> 
        <button id="fbtn" type="submit" class="bg-white text-cyan-600 px-4 py-2 rounded-md font-medium hover:bg-cyan-50 w-80">Submit</button>
    </div>

    <div id="sdiv" class=" sec flex flex-col mx-auto items-center justify-center bg-cyan-600 w-100 h-100 gap-4 mt-10  ">
        <h1 id="stxt" class="text-2xl font-bold text-white"></h1> 
        <input id="sinput" type="text" class="rounded-md border mt-10 border-gray-300 px-3 py-2 w-80 bg-white text-black" placeholder="Enter Number"/> 
        <button id="sbtn" type="submit" class="bg-white text-cyan-600 px-4 py-2 rounded-md font-medium hover:bg-cyan-50 w-80">Submit</button>
    </div>

    <div id="tdiv" class="flex flex-col mx-auto items-center justify-center bg-cyan-600 w-100 h-100 gap-4 mt-10">
        <h1 id="ttxt" class="text-2xl font-bold text-white">2nd player</h1> 
        <input id="tinput" type="text" class="rounded-md border mt-10 border-gray-300 px-3 py-2 w-80 bg-white text-black" placeholder="Enter your name"/> 
        <button id="tbtn" type="submit" class="bg-white text-cyan-600 px-4 py-2 rounded-md font-medium hover:bg-cyan-50 w-80">Submit</button>
    </div>

    <div id="div4" class=" flex flex-col mx-auto items-center justify-center bg-cyan-600 w-100 h-100 gap-4 mt-10  ">
        <h1 id="txt4" class="text-2xl font-bold text-white"></h1> 
        <input id="input4" type="text" class="rounded-md border mt-10 border-gray-300 px-3 py-2 w-80 bg-white text-black" placeholder="Enter Number"/> 
        <button id="btn4" type="submit" class="bg-white text-cyan-600 px-4 py-2 rounded-md font-medium hover:bg-cyan-50 w-80">Submit</button>
        <h3 id="h4"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
